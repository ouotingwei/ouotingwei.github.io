<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    {% seo %}

    <!-- 非 Apple 裝置沒有 SF Pro，用 Inter 當備援字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- 頂部導覽列（毛玻璃） -->
    <nav class="globalnav" aria-label="Main">
      <div class="globalnav-inner">
        <a class="globalnav-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <ul class="globalnav-links">
          <li><a href="#research">Research</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#experience">Experience</a></li>
        </ul>
        <a class="btn btn-primary btn-sm" href="{{ '/assets/doc/CV.pdf' | relative_url }}" target="_blank" rel="noopener noreferrer">CV</a>
      </div>
    </nav>

    <main id="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. Built with Jekyll and hosted on GitHub Pages.</p>
      </div>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script>
      window.addEventListener('load', function () {
        // ===== Travel Map =====
        var mapEl = document.getElementById('travel-map');
        if (!mapEl || typeof L === 'undefined') return;

        var map = L.map('travel-map', {
          zoomControl: false,
          scrollWheelZoom: false,
          attributionControl: true,
          zoomSnap: 0.1,
          maxBounds: [[-70, -200], [85, 200]],
          maxBoundsViscosity: 1
        });
        map.attributionControl.addAttribution('Map data &copy; Natural Earth');

        // 底圖：不用第三方圖磚（CARTO 已改成需要 API key），
        // 直接畫自己網站上的世界陸地輪廓（Natural Earth 1:110m，公有領域）
        map.createPane('land');
        map.getPane('land').style.zIndex = 350;
        fetch({{ '/assets/data/land-110m.json' | relative_url | jsonify }})
          .then(function (res) { return res.json(); })
          .then(function (land) {
            L.geoJSON(land, {
              pane: 'land',
              interactive: false,
              style: { stroke: false, fillColor: '#e3e3e8', fillOpacity: 1 }
            }).addTo(map);
          })
          .catch(function () { /* 陸地載入失敗時仍保留標記點 */ });

        var places = [
          {% for p in site.data.travel_map %}
          {
            name: {{ p.name | jsonify }},
            city: {{ p.city | jsonify }},
            lat: {{ p.lat }},
            lng: {{ p.lng }},
            photo: {{ p.photo | relative_url | jsonify }}
          }{% unless forloop.last %},{% endunless %}
          {% endfor %}
        ];

        places.forEach(function (p) {
          L.circleMarker([p.lat, p.lng], {
            radius: 5,
            color: '#ffffff',
            fillColor: '#0071e3',
            fillOpacity: 1,
            weight: 2
          }).addTo(map).bindTooltip(
            '<div class="map-tooltip">' +
              '<img src="' + p.photo + '" alt="' + p.name + '">' +
              '<div class="map-caption"><strong>' + p.name + '</strong><br>' + p.city + '</div>' +
            '</div>',
            { direction: 'top', opacity: 1 }
          );
        });

        if (places.length) {
          map.fitBounds(places.map(function (p) { return [p.lat, p.lng]; }), { padding: [40, 40], maxZoom: 3 });
        } else {
          map.setView([30, 0], 1);
        }
      });
    </script>
    {% if site.twin.api_url and site.twin.api_url != "" %}
      {% include twin-chat.html %}
    {% endif %}
  </body>
</html>
