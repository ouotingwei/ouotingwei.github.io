<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    
    <link rel="stylesheet" href="https://unpkg.com/beerslider/dist/BeerSlider.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
      .beer-slider {
        border-radius: 8px;
        overflow: hidden;
        margin: 20px 0;
      }
      /* 讓目前所在頁面的選單文字變色，方便辨識 */
      .nav-link.active {
        color: #2e7d32; 
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ "/" | relative_url }}">{{ site.title }}</a></h1>
        {% if site.logo %}
          <img src="{{ site.logo | relative_url }}" alt="Logo" style="width: 300px; margin-bottom: 20px;" />
        {% endif %}
        <p>{{ site.description }}</p>

        <nav>
          <ul class="sidebar-links">
            <li>
              <a href="https://github.com/ouotingwei"
                target="_blank"
                rel="noopener noreferrer"
                class="nav-link">
                <i class="fa-brands fa-github"></i>
                <span>GitHub</span>
              </a>
            </li>

            <li>
              <a href="https://www.linkedin.com/in/tingweiouo/"
                target="_blank"
                rel="noopener noreferrer"
                class="nav-link">
                <i class="fa-brands fa-linkedin"></i>
                <span>LinkedIn</span>
              </a>
            </li>

            <li>
              <a href="mailto:kklb1716@gmail.com"
                class="nav-link">
                <i class="fa-solid fa-envelope"></i>
                <span>Email</span>
              </a>
            </li>

            <li>
              <a href="https://www.youtube.com/@weiweiwei-2001"
                target="_blank"
                rel="noopener noreferrer"
                class="nav-link">
                <i class="fa-brands fa-youtube"></i>
                <span>YouTube</span>
              </a>
            </li>
          </ul>

          <div class="sidebar-section">
            <div class="sidebar-section-title">Research Tools</div>

            <a href="https://ouotingwei.github.io/daily-arXiv-ai-enhanced/"
              target="_blank"
              rel="noopener noreferrer"
              class="tool-link">

              <i class="fa-solid fa-newspaper"></i>

              <span class="tool-text">
                <strong>Daily arXiv Digest</strong>
                <small>Robotics, SLAM and computer vision papers</small>
              </span>

              <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
            </a>
          </div>
        </nav>
      </header>

      <section>
        {{ content }}
      </section>

      <footer>
        <p><small>Hosted on GitHub Pages &mdash; Theme by orderedlist</small></p>
      </footer>
    </div>

    <script src="https://unpkg.com/beerslider/dist/BeerSlider.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        // 初始化 BeerSlider
        const sliders = document.querySelectorAll('.beer-slider');
        sliders.forEach(function(slider) {
          new BeerSlider(slider, { start: '50' });
        });

        // 自動高亮當前頁面的選單連結
        const currentPath = window.location.pathname;
        document.querySelectorAll('.nav-link').forEach(link => {
          if (link.getAttribute('href').includes(currentPath) && currentPath !== '/') {
            link.classList.add('active');
          }
        });
      });
    </script>
  </body>
</html>
